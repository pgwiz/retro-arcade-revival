[package]
name = "backend"
version = "0.1.0"

[build]
outputDir = "src/backend/dist"
args = [ "--release" ]
check-wasm = true

[canisters.backend]
main = "src/backend/main.mo"

[toolchain]
moc = "2.1.0"
lintoko = "0.12.0"

[moc]
args = [ "--implicit-package=core", "-no-check-ir", "-E=M0254", "-W=M0235,M0223,M0236,M0237", "-A=M0241" ]

[dependencies]
core = "2.7.0"
